security:
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\MagicLinkAuthenticator
            entry_point: App\Security\ApiAuthenticationEntryPoint

    access_control:
        - { path: ^/api/config$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/csrf$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/magic-link, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/invites/[^/]+/claim$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_BROWSING_OR_MEMBER }
