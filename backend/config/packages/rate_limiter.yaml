framework:
    rate_limiter:
        magic_link_request:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        magic_link_verify:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        invite_claim:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # IP-keyed limiters require Symfony `trusted_proxies` in framework.yaml behind a reverse proxy.
        geocode_public:
            policy: sliding_window
            limit: 40
            interval: '5 minutes'
        geocode_member:
            policy: sliding_window
            limit: 120
            interval: '5 minutes'
