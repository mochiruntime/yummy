services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/yummy:cached
    command: sleep infinity
    environment:
      APP_ENV: dev
      XDEBUG_MODE: "off"
      APP_CACHE_DIR: "/tmp/yummy-cache"
      APP_LOG_DIR: "/tmp/yummy-log"
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --innodb-flush-log-at-trx-commit=2
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: yummy
      MARIADB_USER: yummy
      MARIADB_PASSWORD: yummy
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mariadb_data:
