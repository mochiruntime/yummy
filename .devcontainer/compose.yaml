services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/yummy:cached
    command: sleep infinity
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://yummy:yummy@mariadb:3306/yummy?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: yummy
      MARIADB_USER: yummy
      MARIADB_PASSWORD: yummy
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mariadb_data:
